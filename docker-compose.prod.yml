name: strayttix-prod

services:
  # ----------------------------------------------------------------------------
  # 1. Laravel Application (PHP-FPM)
  # ----------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE:-ghcr.io/kelvinasonta/strayttix-be:latest}
    container_name: strayttix-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - strayttix-internal
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/up SCRIPT_FILENAME=/var/www/html/public/index.php REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Web Server Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: strayttix-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - strayttix-internal
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Database (MySQL 8.0) - Conservative Memory Footprint for 2GB RAM
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: strayttix-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --innodb-log-buffer-size=16M
      --max-connections=50
      --table-open-cache=400
      --sort-buffer-size=512K
      --read-buffer-size=256K
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-strayttix}
      MYSQL_USER: ${DB_USERNAME:-strayttix_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - strayttix-internal
    # Notice: Port 3306 is strictly NOT exposed to the host/internet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 4. Background Queue Worker (Database-backed by default)
  # ----------------------------------------------------------------------------
  queue:
    image: ${APP_IMAGE:-ghcr.io/kelvinasonta/strayttix-be:latest}
    container_name: strayttix-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=128
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - strayttix-internal
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. Scheduled Task Runner (Laravel Schedule)
  # ----------------------------------------------------------------------------
  scheduler:
    image: ${APP_IMAGE:-ghcr.io/kelvinasonta/strayttix-be:latest}
    container_name: strayttix-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - strayttix-internal
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ------------------------------------------------------------------------------
# Persistent Network & Volumes
# ------------------------------------------------------------------------------
networks:
  strayttix-internal:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  app-storage:
    driver: local

