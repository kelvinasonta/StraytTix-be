services:
  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventos-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-eventos}
      - DB_USERNAME=${DB_USERNAME:-eventos_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    networks:
      - eventos-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: eventos-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - eventos-network
    depends_on:
      - app

  # Database (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: eventos-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-eventos}
      MYSQL_USER: ${DB_USERNAME:-eventos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - eventos-mysql-data:/var/lib/mysql
    networks:
      - eventos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache & Queue Broker (Redis)
  redis:
    image: redis:alpine
    container_name: eventos-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - eventos-redis-data:/data
    networks:
      - eventos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventos-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-eventos}
      - DB_USERNAME=${DB_USERNAME:-eventos_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    networks:
      - eventos-network
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Mail Server & Web UI (Mailpit)
  mailpit:
    image: axllent/mailpit:latest
    container_name: eventos-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP port
      - "8025:8025"   # Web UI port
    networks:
      - eventos-network

  # Database Management (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: eventos-phpmyadmin
    restart: unless-stopped
    ports:
      - "${FORWARD_PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-eventos_user}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 64M
    networks:
      - eventos-network
    depends_on:
      mysql:
        condition: service_healthy

  # S3-compatible Object Storage (MinIO)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: eventos-minio
    restart: unless-stopped
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"         # MinIO S3 API
      - "${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - eventos-minio-data:/data
    networks:
      - eventos-network
    command: server /data --console-address ":9001"

networks:
  eventos-network:
    driver: bridge

volumes:
  eventos-mysql-data:
    driver: local
  eventos-redis-data:
    driver: local
  eventos-minio-data:
    driver: local
