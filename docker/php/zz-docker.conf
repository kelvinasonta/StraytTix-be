[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Use ondemand to conserve memory on 2GB RAM VPS
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

